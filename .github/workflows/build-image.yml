name: Build arm64 image

# 构建并推送 arm64 镜像
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE_NAME: media-parser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT=$(git rev-parse --short=7 HEAD)
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this commit was already built
        id: check
        run: |
          if docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "镜像已存在（${{ steps.meta.outputs.sha_tag }}），跳过本次构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push arm64 image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max