name: Cleanup image versions

on:
  schedule:
    # UTC 周日 03:00 = 北京时间周日 11:00
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: cleanup-images
  cancel-in-progress: false

env:
  IMAGE_NAME: media-parser

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Keep newest version, delete the rest
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 1
          # 配了 PACKAGES_TOKEN（classic PAT，含 read:packages + delete:packages）就优先用，
          # 否则回退到内置 GITHUB_TOKEN（要求仓库在包的 Manage Actions Access 里有 Admin 角色）
          token: ${{ secrets.PACKAGES_TOKEN || github.token }}