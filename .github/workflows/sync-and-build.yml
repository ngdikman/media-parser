name: Sync upstream and build image

# 定时检查上游 ucmao/media-parser，有更新就强制对齐并重新构建 arm64 镜像
on:
  schedule:
    # 每天 03:00 UTC（北京时间 11:00）
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-and-build.yml"

concurrency:
  group: sync-and-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ucmao/media-parser
  UPSTREAM_BRANCH: main
  IMAGE_NAME: media-parser
  WORKFLOW_PATH: .github/workflows/sync-and-build.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upstream_sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Resolve upstream commit
        id: meta
        run: |
          SHA=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "upstream ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} = ${SHA}"

      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force sync code from upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PREV=$(git rev-parse HEAD)
          # 上游没有本工作流文件，强制对齐前先备份，对齐后再放回
          cp "$WORKFLOW_PATH" /tmp/workflow.yml

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git checkout -B main "upstream/${UPSTREAM_BRANCH}"

          mkdir -p "$(dirname "$WORKFLOW_PATH")"
          cp /tmp/workflow.yml "$WORKFLOW_PATH"
          git add "$WORKFLOW_PATH"

          # 只比较代码部分，工作流文件本身的差异不算上游更新
          if git diff --quiet "$PREV" "upstream/${UPSTREAM_BRANCH}" -- . ":(exclude)${WORKFLOW_PATH}"; then
            echo "上游代码无变化，跳过推送"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: 同步上游 ${UPSTREAM_REPO}@${{ steps.meta.outputs.short }}"
          git push --force origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve image tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${{ needs.sync.outputs.short_sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this upstream commit was already built
        id: check
        run: |
          if docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "镜像已存在（${{ steps.meta.outputs.sha_tag }}），跳过本次构建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push arm64 image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.sync.outputs.upstream_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max